<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRZ Official</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:linear-gradient(135deg,#0f0f0f,#1a1a1a);
  color:white;
}

header{
  background:rgba(255,215,0,0.08);
  backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,215,0,0.2);
  padding:15px;
}

.logo{
  text-align:center;
  color:gold;
  font-size:28px;
  font-weight:bold;
}

.hero{
  text-align:center;
  padding:60px 20px;
}

.glass{
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,215,0,0.2);
  border-radius:20px;
  padding:25px;
  max-width:700px;
  margin:auto;
}

h1{
  color:gold;
}

.btn{
  margin-top:20px;
  padding:12px 25px;
  border:none;
  border-radius:25px;
  background:gold;
  color:black;
  font-weight:bold;
  cursor:pointer;
}

.btn.active{
  background:limegreen;
  color:white;
}

.section-title{
  text-align:center;
  color:gold;
  margin:40px 0 20px;
}

.members-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  padding:20px;
}

.card{
  background:rgba(255,255,255,0.08);
  border-radius:20px;
  padding:20px;
  text-align:center;
  border:1px solid rgba(255,215,0,0.2);
}

.avatar{
  width:100px;
  height:100px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid gold;
  margin-bottom:10px;
}

.badge{
  background:rgba(255,215,0,0.2);
  color:gold;
  display:inline-block;
  padding:5px 12px;
  border-radius:10px;
  margin-top:10px;
}

footer{
  text-align:center;
  padding:20px;
  color:#aaa;
}
</style>
</head>

<body>

<header>
  <div class="logo">MRZ Official</div>
</header>

<section class="hero">
  <div class="glass">
    <h1>Welcome to MRZ Official</h1>
    <p>Official Gaming Team</p>
    <button class="btn" id="joinBtn">Join Team</button>
  </div>
</section>

<h2 class="section-title">Our Members</h2>

<div class="members-grid" id="membersGrid"></div>

<footer>
© 2026 MRZ Official
</footer>

<script>

// Join button
const btn = document.getElementById("joinBtn");

btn.addEventListener("click", () => {
  btn.classList.toggle("active");

  if(btn.classList.contains("active")){
    btn.innerText = "Joined ✔";
  } else {
    btn.innerText = "Join Team";
  }
