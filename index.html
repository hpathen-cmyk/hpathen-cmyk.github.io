<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRZ ULTRA PRO</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#000;
  color:white;
  overflow-x:hidden;
}

/* PARTICLES CANVAS */
canvas{
  position:fixed;
  top:0;
  left:0;
  z-index:-1;
}

/* HEADER */
header{
  text-align:center;
  padding:20px;
  background:rgba(20,20,20,0.8);
  color:gold;
  font-size:26px;
  font-weight:bold;
}

/* TOP BAR */
.topbar{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  padding:10px;
}

input, select, button{
  padding:10px;
  border-radius:10px;
  border:none;
  outline:none;
}

button{
  background:gold;
  cursor:pointer;
}

/* GRID */
.members-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:20px;
  padding:20px;
  perspective:1200px;
}

/* 3D CARD */
.card{
  background:linear-gradient(145deg,#1a1a1a,#0b0b0b);
  border:1px solid gold;
  border-radius:15px;
  text-align:center;
  padding:15px;
  transform-style:preserve-3d;
  transition:0.2s;
  cursor:pointer;
}

/* IMAGE */
.avatar{
  width:80px;
  height:80px;
  border-radius:50%;
  border:2px solid gold;
  object-fit:cover;
  transform:translateZ(40px);
}

/* TEXT */
h3{
  transform:translateZ(30px);
  margin:10px 0 5px;
}

.badge{
  display:inline-block;
  padding:5px 10px;
  background:rgba(255,215,0,0.2);
  color:gold;
  border-radius:10px;
  font-size:12px;
  transform:translateZ(20px);
}

/* ADMIN PANEL */
#admin{
  display:none;
  padding:10px;
  text-align:center;
}

/* MODAL */
#modal{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.85);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-box{
  background:#111;
  padding:20px;
  border-radius:15px;
  border:1px solid gold;
  text-align:center;
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<header>MRZ ULTRA PRO DASHBOARD</header>

<!-- TOP BAR -->
<div class="topbar">
  <input id="search" placeholder="Search member...">
  <select id="filter">
    <option>All</option>
    <option>God Father</option>
    <option>Leader</option>
    <option>Co Leader</option>
    <option>Member</option>
  </select>
  <button onclick="toggleAdmin()">Admin</button>
</div>

<!-- ADMIN PANEL -->
<div id="admin">
  <input id="name" placeholder="Name">
  <input id="role" placeholder="Role">
  <input id="image" placeholder="Image URL">
  <button onclick="addMember()">Add Member</button>
</div>

<div class="members-grid" id="grid"></div>

<!-- MODAL -->
<div id="modal">
  <div class="modal-box">
    <h3 id="mname"></h3>
    <div id="mrole" class="badge"></div>
    <br>
    <button onclick="closeModal()">Close</button>
  </div>
</div>

<script>

/* SOUND */
function clickSound(){
  let ctx = new (window.AudioContext || window.webkitAudioContext)();
  let osc = ctx.createOscillator();
  osc.type="sine";
  osc.frequency.value=600;
  osc.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime+0.1);
}

/* PARTICLES */
const canvas=document.getElementById("bg");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];
for(let i=0;i<80;i++){
  particles.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    r:Math.random()*2,
    dx:(Math.random()-0.5)*1,
    dy:(Math.random()-0.5)*1
  });
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  particles.forEach(p=>{
    p.x+=p.dx;
    p.y+=p.dy;

    if(p.x<0||p.x>canvas.width)p.dx*=-1;
    if(p.y<0||p.y>canvas.height)p.dy*=-1;

    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle="gold";
    ctx.fill();
  });

  requestAnimationFrame(animate);
}
animate();

/* DATA */
let members=JSON.parse(localStorage.getItem("mrz"))||[
{name:"Mrz Thoppi",role:"God Father",image:"https://i.postimg.cc/7LPXhncP/Screenshot-20260524-145928-Instagram.png"},
{name:"Mrz Rambo",role:"Leader",image:"https://i.postimg.cc/pTCmTKwX/Screenshot-20260527-185749-Instagram.png"},
{name:"Mrz Sheik",role:"Co Leader",image:"https://i.postimg.cc/pLk8ybKM/Screenshot-20260527-185803-Instagram.png"},
{name:"Mrz Mack",role:"Co Leader",image:"https://i.postimg.cc/mDnykffZ/Screenshot-20260527-191534-Instagram.png"}
];

const grid=document.getElementById("grid");

function show(list){
  grid.innerHTML="";
  list.forEach(m=>{
    let div=document.createElement("div");
    div.className="card";

    div.innerHTML=`
      <img class="avatar" src="${m.image}">
      <h3>${m.name}</h3>
      <div class="badge">${m.role}</div>
    `;

    /* 3D tilt */
    div.addEventListener("mousemove",(e)=>{
      let x=(e.offsetX/div.clientWidth)*20-10;
      let y=(e.offsetY/div.clientHeight)*20-10;
      div.style.transform=`rotateY(${x}deg) rotateX(${-y}deg)`;
    });

    div.addEventListener("mouseleave",()=>{
      div.style.transform="rotateY(0deg) rotateX(0deg)";
    });

    div.onclick=()=>{
      clickSound();
      openModal(m);
    };

    grid.appendChild(div);
  });
}

show(members);

/* SEARCH + FILTER */
document.getElementById("search").oninput=update;
document.getElementById("filter").onchange=update;

function update(){
  let s=document.getElementById("search").value.toLowerCase();
  let f=document.getElementById("filter").value;

  let out=members.filter(m=>{
    return m.name.toLowerCase().includes(s) &&
    (f==="All"||m.role===f);
  });

  show(out);
}

/* ADMIN */
function toggleAdmin(){
  let a=document.getElementById("admin");
  a.style.display=a.style.display==="block"?"none":"block";
}

function addMember(){
  let m={
    name:document.getElementById("name").value,
    role:document.getElementById("role").value,
    image:document.getElementById("image").value
  };

  members.push(m);
  localStorage.setItem("mrz",JSON.stringify(members));
  show(members);
}

/* MODAL */
function openModal(m){
  document.getElementById("modal").style.display="flex";
  document.getElementById("mname").innerText=m.name;
  document.getElementById("mrole").innerText=m.role;
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

</script>

</body>
  </html>
