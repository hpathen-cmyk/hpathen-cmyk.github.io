<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRZ Ultra Pro 3D</title>

<style>
body{
  margin:0;
  font-family:Arial;
  overflow:hidden;
  background:black;
  color:white;
}

/* ===== 3D SPACE BACKGROUND ===== */
.space{
  position:fixed;
  width:100%;
  height:100%;
  background:radial-gradient(circle at 30% 30%, #1a2b4f, transparent),
             radial-gradient(circle at 70% 70%, #3a1b4f, transparent),
             radial-gradient(circle at center, #000, #000);
  animation:moveBg 8s infinite alternate;
  z-index:-2;
}

@keyframes moveBg{
  0%{filter:hue-rotate(0deg);}
  100%{filter:hue-rotate(60deg);}
}

/* ===== HEADER ===== */
header{
  position:fixed;
  top:0;
  width:100%;
  text-align:center;
  padding:15px;
  font-size:24px;
  font-weight:bold;
  color:#7ffcff;
  background:rgba(0,0,0,0.4);
  backdrop-filter:blur(10px);
  z-index:10;
}

/* ===== 3D SCENE ===== */
.scene{
  width:100%;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  perspective:1200px;
}

/* ===== ROTATING CONTAINER ===== */
.carousel{
  width:300px;
  height:400px;
  position:relative;
  transform-style:preserve-3d;
  animation:rotate 18s infinite linear;
}

@keyframes rotate{
  0%{transform:rotateY(0deg);}
  100%{transform:rotateY(360deg);}
}

/* ===== CARD ===== */
.card{
  position:absolute;
  width:200px;
  height:260px;
  left:50px;
  top:70px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(127,255,255,0.3);
  border-radius:15px;
  text-align:center;
  padding:10px;
  backdrop-filter:blur(10px);
  box-shadow:0 0 20px rgba(0,255,255,0.2);
  transition:0.3s;
}

.card:hover{
  transform:scale(1.1);
  box-shadow:0 0 30px #7ffcff;
}

.avatar{
  width:80px;
  height:80px;
  border-radius:50%;
  border:2px solid #7ffcff;
  margin-top:10px;
}

.badge{
  margin-top:8px;
  display:inline-block;
  padding:5px 10px;
  font-size:12px;
  border-radius:10px;
  background:rgba(127,255,255,0.15);
}

/* ===== MODAL ===== */
#modal{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.85);
}

.modal-box{
  background:#0c1118;
  padding:20px;
  border-radius:15px;
  border:1px solid #7ffcff;
  text-align:center;
}

button{
  margin-top:10px;
  padding:8px 12px;
  background:#7ffcff;
  border:none;
  cursor:pointer;
  border-radius:5px;
}
</style>
</head>

<body>

<div class="space"></div>

<header>🚀 MRZ ULTRA PRO 3D 🚀</header>

<div class="scene">
  <div class="carousel" id="carousel"></div>
</div>

<!-- MODAL -->
<div id="modal">
  <div class="modal-box">
    <h3 id="mname"></h3>
    <div id="mrole" class="badge"></div>
    <br>
    <button onclick="closeModal()">Close</button>
  </div>
</div>

<script>

/* ===== MEMBERS ===== */
const members=[
{name:"Mrz Thoppi",role:"God Father",image:"https://i.postimg.cc/7LPXhncP/Screenshot-20260524-145928-Instagram.png"},
{name:"Mrz Rambo",role:"Leader",image:"https://i.postimg.cc/pTCmTKwX/Screenshot-20260527-185749-Instagram.png"},
{name:"Mrz Sheik",role:"Co Leader",image:"https://i.postimg.cc/pLk8ybKM/Screenshot-20260527-185803-Instagram.png"},
{name:"Mrz Mack",role:"Co Leader",image:"https://i.postimg.cc/mDnykffZ/Screenshot-20260527-191534-Instagram.png"},
{name:"Mrz Appapan",role:"Member",image:"https://i.postimg.cc/kXWMTQ5D/Screenshot-20260527-192458-Instagram.png"},
{name:"Mrz Bilal",role:"Member",image:"https://i.postimg.cc/L8RPD6mZ/Screenshot-20260527-193149-Instagram.png"},
{name:"Mrz Raju Bhai",role:"Member",image:"https://i.postimg.cc/MpyDZFpj/Screenshot-20260527-194203-Instagram.png"},
{name:"Mrz Falcon",role:"Member",image:"https://i.postimg.cc/j5rW2bRC/Screenshot-20260527-212914-Instagram.png"}
];

const carousel=document.getElementById("carousel");

/* ===== BUILD 3D CIRCLE ===== */
const angleStep = 360 / members.length;

members.forEach((m,i)=>{
  let div=document.createElement("div");
  div.className="card";

  let angle=i*angleStep;
  div.style.transform=`rotateY(${angle}deg) translateZ(400px)`;

  div.innerHTML=`
    <img class="avatar" src="${m.image}">
    <h3>${m.name}</h3>
    <div class="badge">${m.role}</div>
  `;

  div.onclick=()=>openModal(m);

  carousel.appendChild(div);
});

/* ===== MODAL ===== */
function openModal(m){
  document.getElementById("modal").style.display="flex";
  document.getElementById("mname").innerText=m.name;
  document.getElementById("mrole").innerText=m.role;
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

</script>

</body>
</html>
