<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRZ Real Pro Framer</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#05070f;
  color:white;
  overflow-x:hidden;
}

/* ===== BACKGROUND LAYERS ===== */
.bg{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:radial-gradient(circle at 20% 20%, #1a2b4f, transparent),
             radial-gradient(circle at 80% 80%, #3a1b4f, transparent),
             #05070f;
  z-index:-2;
  transition:1s ease;
}

/* CURSOR GLOW */
.cursor{
  position:fixed;
  width:200px;
  height:200px;
  border-radius:50%;
  background:rgba(0,255,255,0.15);
  filter:blur(80px);
  pointer-events:none;
  transform:translate(-50%,-50%);
  z-index:-1;
}

/* HEADER */
header{
  position:sticky;
  top:0;
  padding:18px;
  text-align:center;
  font-size:24px;
  font-weight:bold;
  background:rgba(0,0,0,0.4);
  backdrop-filter: blur(12px);
  color:#7ffcff;
  z-index:10;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.hero h1{
  font-size:42px;
  color:#7ffcff;
  transform:translateY(30px);
  opacity:0;
  animation:fadeUp 1s forwards;
}

.hero p{
  color:#aaa;
  opacity:0;
  animation:fadeUp 1s 0.3s forwards;
}

@keyframes fadeUp{
  to{opacity:1;transform:translateY(0);}
}

/* SECTION */
.section{
  padding:80px 20px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
  perspective:1200px;
}

/* CARD */
.card{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(127,255,255,0.2);
  border-radius:15px;
  padding:15px;
  text-align:center;
  backdrop-filter:blur(12px);
  transition:0.4s;
  transform:translateY(60px) scale(0.95);
  opacity:0;
}

.card.show{
  transform:translateY(0) scale(1);
  opacity:1;
}

.card:hover{
  transform:rotateX(10deg) rotateY(-10deg) scale(1.05);
  box-shadow:0 0 25px #7ffcff;
}

.avatar{
  width:80px;
  height:80px;
  border-radius:50%;
  border:2px solid #7ffcff;
}

.badge{
  margin-top:8px;
  display:inline-block;
  padding:5px 10px;
  font-size:12px;
  border-radius:10px;
  background:rgba(127,255,255,0.15);
}

/* MODAL */
#modal{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.85);
}

.modal-box{
  background:#0c1118;
  padding:20px;
  border-radius:15px;
  border:1px solid #7ffcff;
  text-align:center;
}
button{
  margin-top:10px;
  padding:8px 12px;
  background:#7ffcff;
  border:none;
  border-radius:5px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="cursor" id="cursor"></div>

<header>🌟 MRZ REAL PRO FRAMER 🌟</header>

<div class="hero">
  <h1>MRZ CLAN</h1>
  <p>Scroll for cinematic experience</p>
</div>

<div class="section">
  <div class="grid" id="grid"></div>
</div>

<div id="modal">
  <div class="modal-box">
    <h3 id="mname"></h3>
    <div id="mrole" class="badge"></div>
    <br>
    <button onclick="closeModal()">Close</button>
  </div>
</div>

<script>

/* ===== CURSOR GLOW ===== */
const cursor=document.getElementById("cursor");

window.addEventListener("mousemove",(e)=>{
  cursor.style.left=e.clientX+"px";
  cursor.style.top=e.clientY+"px";
});

/* ===== MEMBERS ===== */
const members=[
{name:"Mrz Thoppi",role:"God Father",image:"https://i.postimg.cc/7LPXhncP/Screenshot-20260524-145928-Instagram.png"},
{name:"Mrz Rambo",role:"Leader",image:"https://i.postimg.cc/pTCmTKwX/Screenshot-20260527-185749-Instagram.png"},
{name:"Mrz Sheik",role:"Co Leader",image:"https://i.postimg.cc/pLk8ybKM/Screenshot-20260527-185803-Instagram.png"},
{name:"Mrz Mack",role:"Co Leader",image:"https://i.postimg.cc/mDnykffZ/Screenshot-20260527-191534-Instagram.png"},
{name:"Mrz Appapan",role:"Member",image:"https://i.postimg.cc/kXWMTQ5D/Screenshot-20260527-192458-Instagram.png"},
{name:"Mrz Bilal",role:"Member",image:"https://i.postimg.cc/L8RPD6mZ/Screenshot-20260527-193149-Instagram.png"},
{name:"Mrz Raju Bhai",role:"Member",image:"https://i.postimg.cc/MpyDZFpj/Screenshot-20260527-194203-Instagram.png"},
{name:"Mrz Falcon",role:"Member",image:"https://i.postimg.cc/j5rW2bRC/Screenshot-20260527-212914-Instagram.png"}
];

const grid=document.getElementById("grid");

/* ===== RENDER ===== */
members.forEach(m=>{
  let div=document.createElement("div");
  div.className="card";

  div.innerHTML=`
    <img class="avatar" src="${m.image}">
    <h3>${m.name}</h3>
    <div class="badge">${m.role}</div>
  `;

  div.onclick=()=>openModal(m);
  grid.appendChild(div);
});

/* ===== SCROLL ANIMATION ===== */
window.addEventListener("scroll",()=>{
  document.querySelectorAll(".card").forEach(card=>{
    let top=card.getBoundingClientRect().top;
    if(top<window.innerHeight-80){
      card.classList.add("show");
    }
  });
});

/* ===== MODAL ===== */
function openModal(m){
  document.getElementById("modal").style.display="flex";
  document.getElementById("mname").innerText=m.name;
  document.getElementById("mrole").innerText=m.role;
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

</script>

</body>
</html>
