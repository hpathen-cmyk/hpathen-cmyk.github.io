<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRZ Official</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:linear-gradient(135deg,#0f0f0f,#1a1a1a);
  color:white;
  overflow-x:hidden;
}

header{
  position:sticky;
  top:0;
  background:rgba(255,215,0,0.08);
  backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,215,0,0.2);
  padding:15px 20px;
}

.logo{
  text-align:center;
  color:gold;
  font-size:28px;
  font-weight:bold;
}

.hero{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
}

.glass{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(14px);
  border:1px solid rgba(255,215,0,0.2);
  border-radius:25px;
  padding:30px;
  box-shadow:0 0 30px rgba(255,215,0,0.15);
}

h1{
  font-size:3rem;
  color:gold;
}

p{
  color:#ddd;
  margin-top:10px;
}

.btn{
  margin-top:20px;
  padding:12px 25px;
  border:none;
  border-radius:25px;
  background:gold;
  color:#111;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

.btn:hover{
  transform:scale(1.05);
}

.btn.active{
  background:limegreen;
  color:white;
}

section{
  padding:70px 20px;
}

.section-title{
  text-align:center;
  color:gold;
  font-size:2rem;
  margin-bottom:30px;
}

.members-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
  gap:15px;
  max-width:1200px;
  margin:auto;
}

.card{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(12px);
  border-radius:20px;
  padding:20px;
  text-align:center;
  border:1px solid rgba(255,215,0,0.2);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-8px);
}

.avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  border:2px solid gold;
  margin:0 auto 15px;
  background:#333;
}

.badge{
  display:inline-block;
  padding:5px 10px;
  margin-top:8px;
  border-radius:12px;
  font-size:12px;
  background:rgba(255,215,0,0.2);
  color:gold;
}

footer{
  text-align:center;
  padding:30px;
  color:#aaa;
}

</style>
</head>

<body>

<header>
<div class="logo">MRZ Official</div>
</header>

<section class="hero">
<div class="glass">
<h1>Welcome to MRZ Official</h1>
<p>Official Gaming Team</p>
<button class="btn">Join Team</button>
</div>
</section>

<section>
<h2 class="section-title">About MRZ</h2>
<div class="glass">
<p>
MRZ Official is a professional gaming community built for teamwork, skill, and entertainment.
We bring passionate gamers together to create a powerful team.
</p>
</div>
</section>

<section>
<h2 class="section-title">Our Members</h2>
<div class="members-grid" id="membersGrid"></div>
</section>

<footer>
© 2026 MRZ Official
</footer>

<script>

// Button toggle
const btn = document.querySelector(".btn");

btn.addEventListener("click", () => {
  btn.classList.toggle("active");
  btn.innerText = btn.classList.contains("active")
    ? "Joined ✔"
    : "Join Team";
});

// Members data (your full list)
const members = [
  "Mrz thoppi (God father)",

  "Mrz sheik (Co Leader)",
  "Mrz mack (Co Leader)",
  "Mrz appapan (Member)",
  "Mrz bilal (Member)",
  "Mrz Raju bhai (Member)",
  "Mrz kurup denny (Member)",
  "Mrz fluffy (Member)",
  "Mrz ck mari (Member)",
  "Mrz malik (Member)",
  "Mrz zendex duvor (Member)",
  "Mrz Alex duver (Member)",
  "Mrz falcon (Member)",
  "Mrz dnl (Member)",
  "Mrz Amban pro (Member)",
  "Mrz Charan (Member)",
  "Mrz the God (Member)",
  "Mrz Joshua (Member)",
  "Mrz takai (Member)",
  "Mrz sakai (Member)",
  "Mrz speedo (Member)",
  "Mrz ikkrumon (Member)",
  "Mrz pranav (Member)",

  "Mrz Blake (Member)",

  "Mrz minnal (Member)",
  "Mrz shibu (Member)",
  "Mrz bobby (Member)",
  "Mrz rayan (Member)",
  "Mrz Cooper (Member)"
];

// render members
const grid = document.getElementById("membersGrid");

members.forEach(name => {

  let role = "Member";
  if(name.includes("God father")) role = "God Father";
  else if(name.includes("Leader")) role = "Leader";
  else if(name.includes("Co Leader")) role = "Co Leader";

  const card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
    <div class="avatar"></div>
    <h3>${name}</h3>
    <div class="badge">${role}</div>
    <p>Instagram | Discord</p>
  `;

  grid.appendChild(card);
});

</script>

</body>
</html>
