<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JARVIS Interface</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#020617;
color:white;
}

body::before{
content:"";
position:fixed;
width:300%;
height:300%;
background:
radial-gradient(circle,#00d9ff22 0%,transparent 35%),
radial-gradient(circle,#0066ff22 0%,transparent 40%),
radial-gradient(circle,#00ffff22 0%,transparent 45%);
animation:bgMove 18s linear infinite;
}

@keyframes bgMove{

0%{
transform:translate(-20%,-20%) rotate(0deg);
}

100%{
transform:translate(-30%,-25%) rotate(360deg);
}

}

canvas{
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
z-index:0;
}

.card{

position:relative;
z-index:5;

width:360px;
padding:40px;

border-radius:28px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,.15);

box-shadow:

0 0 20px #00d9ff33,

0 0 60px #0066ff22;

text-align:center;

animation:fade .8s ease;
}

@keyframes fade{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:translateY(0);

}

}

.logo{

font-size:70px;

animation:float 3s ease-in-out infinite;

margin-bottom:10px;

}

@keyframes float{

0%,100%{

transform:translateY(0);

}

50%{

transform:translateY(-10px);

}

}

h1{

font-size:40px;

font-weight:700;

letter-spacing:2px;

margin-bottom:8px;

text-shadow:0 0 20px cyan;

}

.subtitle{

color:#cfcfcf;

margin-bottom:25px;

}

.clock{

font-size:30px;

font-weight:bold;

color:#00ffff;

margin-bottom:8px;

}

.date{

color:#ccc;

margin-bottom:25px;

}

button{

width:100%;

padding:16px;

font-size:20px;

border:none;

border-radius:60px;

cursor:pointer;

color:white;

background:linear-gradient(90deg,#00d9ff,#0066ff);

box-shadow:

0 0 20px #00d9ff;

transition:.25s;

position:relative;

overflow:hidden;

}

button:hover{

transform:translateY(-4px);

box-shadow:

0 0 35px cyan;

}

button:active{

transform:scale(.95);

}

.ripple{

position:absolute;

border-radius:50%;

background:white;

transform:scale(0);

animation:ripple .6s linear;

pointer-events:none;

opacity:.7;

}

@keyframes ripple{

to{

transform:scale(5);

opacity:0;

}

}

.visualizer{

display:flex;

justify-content:center;

align-items:flex-end;

gap:5px;

height:55px;

margin-top:25px;

}

.bar{

width:8px;

height:10px;

background:#00ffff;

border-radius:8px;

animation:none;

}

@keyframes music{

0%{height:8px;}
20%{height:45px;}
40%{height:18px;}
60%{height:52px;}
80%{height:24px;}
100%{height:8px;}

}

.footer{

margin-top:20px;

font-size:13px;

color:#aaaaaa;

}

.glow{

position:fixed;

width:120px;

height:120px;

border-radius:50%;

background:#00ffff33;

pointer-events:none;

filter:blur(40px);

z-index:2;

transform:translate(-50%,-50%);

}

</style>
</head>

<body>

<canvas id="particles"></canvas>

<div class="glow" id="glow"></div>

<div class="card">

<div class="logo">🤖</div>

<h1>JARVIS</h1>

<div class="subtitle">
Welcome Back
</div>

<div class="clock" id="clock">
00:00:00
</div>

<div class="date" id="date">
Loading...
</div>

<button id="openBtn">
OPEN
</button>

<div class="visualizer">

<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>

</div>

<div class="footer">

AI Interface

</div>

</div>

<audio id="sound">

<source src="sound.mp3" type="audio/mpeg">

</audio>

<script>
