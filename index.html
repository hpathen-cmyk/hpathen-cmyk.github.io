<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRZ 3D Scroll Rotation</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#05060a;
  color:white;
  overflow:hidden;
}

/* BACKGROUND */
.bg{
  position:fixed;
  width:100%;
  height:100%;
  background:radial-gradient(circle at center,#1a2b4f,#05060a);
  z-index:-1;
}

/* HEADER */
header{
  text-align:center;
  padding:15px;
  font-size:22px;
  color:#7ffcff;
  background:rgba(0,0,0,0.4);
  backdrop-filter:blur(10px);
}

/* SCENE */
.scene{
  width:100%;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  perspective:1200px;
}

/* ROTATOR */
.carousel{
  width:250px;
  height:350px;
  position:relative;
  transform-style:preserve-3d;
}

/* CARD */
.card{
  position:absolute;
  width:180px;
  height:240px;
  left:35px;
  top:55px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(127,255,255,0.25);
  border-radius:15px;
  text-align:center;
  padding:10px;
  backdrop-filter:blur(10px);
  transition:0.3s;
}

.card:hover{
  box-shadow:0 0 20px #7ffcff;
}

.avatar{
  width:75px;
  height:75px;
  border-radius:50%;
  border:2px solid #7ffcff;
}

.badge{
  margin-top:6px;
  font-size:12px;
  padding:4px 8px;
  border-radius:10px;
  display:inline-block;
  background:rgba(127,255,255,0.15);
}
</style>
</head>

<body>

<div class="bg"></div>

<header>🔄 MRZ 3D SCROLL ROTATION</header>

<div class="scene">
  <div class="carousel" id="carousel"></div>
</div>

<script>

/* ===== MEMBERS ===== */
const members=[
{name:"Mrz Thoppi",role:"God Father",image:"https://i.postimg.cc/7LPXhncP/Screenshot-20260524-145928-Instagram.png"},
{name:"Mrz Rambo",role:"Leader",image:"https://i.postimg.cc/pTCmTKwX/Screenshot-20260527-185749-Instagram.png"},
{name:"Mrz Sheik",role:"Co Leader",image:"https://i.postimg.cc/pLk8ybKM/Screenshot-20260527-185803-Instagram.png"},
{name:"Mrz Mack",role:"Co Leader",image:"https://i.postimg.cc/mDnykffZ/Screenshot-20260527-191534-Instagram.png"},
{name:"Mrz Appapan",role:"Member",image:"https://i.postimg.cc/kXWMTQ5D/Screenshot-20260527-192458-Instagram.png"},
{name:"Mrz Bilal",role:"Member",image:"https://i.postimg.cc/L8RPD6mZ/Screenshot-20260527-193149-Instagram.png"},
{name:"Mrz Raju Bhai",role:"Member",image:"https://i.postimg.cc/MpyDZFpj/Screenshot-20260527-194203-Instagram.png"},
{name:"Mrz Falcon",role:"Member",image:"https://i.postimg.cc/j5rW2bRC/Screenshot-20260527-212914-Instagram.png"}
];

const carousel=document.getElementById("carousel");

let angle = 0;
const step = 360 / members.length;

/* BUILD CARDS */
members.forEach((m,i)=>{
  let div=document.createElement("div");
  div.className="card";

  div.style.transform=`rotateY(${i*step}deg) translateZ(300px)`;

  div.innerHTML=`
    <img class="avatar" src="${m.image}">
    <h3>${m.name}</h3>
    <div class="badge">${m.role}</div>
  `;

  carousel.appendChild(div);
});

/* ===== SMOOTH RENDER LOOP ===== */
function animate(){
  carousel.style.transform = `rotateY(${angle}deg)`;
  requestAnimationFrame(animate);
}
animate();

/* ===== SCROLL CONTROL ===== */
window.addEventListener("wheel",(e)=>{
  angle += e.deltaY * 0.2;
});

/* ===== TOUCH / DRAG CONTROL ===== */
let isDown=false;
let startX=0;

document.addEventListener("mousedown",(e)=>{
  isDown=true;
  startX=e.clientX;
});

document.addEventListener("mouseup",()=>isDown=false);

document.addEventListener("mousemove",(e)=>{
  if(!isDown) return;

  let diff = e.clientX - startX;
  angle += diff * 0.3;
  startX = e.clientX;
});

/* MOBILE TOUCH */
document.addEventListener("touchstart",(e)=>{
  startX = e.touches[0].clientX;
});

document.addEventListener("touchmove",(e)=>{
  let diff = e.touches[0].clientX - startX;
  angle += diff * 0.3;
  startX = e.touches[0].clientX;
});

</script>

</body>
</html>
