<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    text-align:center;
}

button{
    margin-top:20px;
    padding:12px 25px;
    font-size:18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#fff;
    color:#000;
}

button:hover{
    background:#ddd;
}
</style>
</head>
<body>

<div class="container">
    <h1>Welcome</h1>
    <p>Click the button below.</p>

    <button onclick="playSound()">Open</button>

    <audio id="sound" src="sound.mp3"></audio>
</div>

<script>
function playSound() {
    document.getElementById("sound").play();
}
</script>

</body>
</html>
