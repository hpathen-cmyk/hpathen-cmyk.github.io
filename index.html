<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRZ Official</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#0f0f0f,#1a1a1a);
color:white;
overflow-x:hidden;
}

/* HEADER */
header{
position:sticky;
top:0;
background:rgba(255,215,0,0.08);
backdrop-filter:blur(14px);
border-bottom:1px solid rgba(255,215,0,0.2);
padding:15px 20px;
z-index:1000;
}

.logo{
text-align:center;
color:gold;
font-size:30px;
font-weight:bold;
}

/* HERO */
.hero{
min-height:70vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
}

.glass{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(14px);
border:1px solid rgba(255,215,0,0.2);
border-radius:25px;
padding:30px;
box-shadow:0 0 30px rgba(255,215,0,0.15);
max-width:700px;
width:100%;
}

.hero h1{
font-size:3rem;
color:gold;
}

.hero p{
margin-top:10px;
color:#ddd;
}

.btn{
margin-top:20px;
padding:12px 25px;
border:none;
border-radius:30px;
background:gold;
color:black;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

.btn:hover{
transform:scale(1.05);
}

.btn.active{
background:limegreen;
color:white;
}

/* SECTIONS */
section{
padding:70px 20px;
}

.section-title{
text-align:center;
color:gold;
font-size:2rem;
margin-bottom:30px;
}

/* MEMBERS GRID */
.members-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
max-width:1300px;
margin:auto;
}

/* CARD */
.card{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(12px);
border-radius:20px;
padding:20px;
text-align:center;
border:1px solid rgba(255,215,0,0.2);
transition:0.3s;
}

.card:hover{
transform:translateY(-8px);
}

/* AVATAR */
.avatar{
width:100px;
height:100px;
border-radius:50%;
border:3px solid gold;
background:#333;
object-fit:cover;
margin:auto;
display:block;
margin-bottom:15px;
}

/* BADGE */
.badge{
display:inline-block;
padding:6px 12px;
margin-top:10px;
border-radius:12px;
font-size:13px;
background:rgba(255,215,0,0.2);
color:gold;
}

/* FOOTER */
footer{
text-align:center;
padding:30px;
color:#aaa;
}

/* MOBILE */
@media(max-width:600px){
.hero h1{
font-size:2.2rem;
}
}

</style>
</head>

<body>

<header>
<div class="logo">MRZ Official</div>
</header>

<section class="hero">
<div class="glass">
<h1>Welcome to MRZ Official</h1>
<p>Official Gaming Team</p>

<button class="btn" id="joinBtn">Join Team</button>
</div>
</section>

<section>
<h2 class="section-title">About MRZ</h2>

<div class="glass">
<p>
MRZ Official is a professional gaming community built for teamwork,
skill, friendship, and entertainment.
We unite passionate gamers together.
</p>
</div>
</section>

<section>
<h2 class="section-title">Our Members</h2>
<div class="members-grid" id="membersGrid"></div>
</section>

<footer>
© 2026 MRZ Official
</footer>

<script>

// JOIN BUTTON
const btn = document.getElementById("joinBtn");

});

</script>

</body>
</html>
