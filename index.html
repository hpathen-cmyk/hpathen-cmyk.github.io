<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRZ Official</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:linear-gradient(135deg,#0f0f0f,#1a1a1a);
  color:white;
  overflow-x:hidden;
}

header{
  position:sticky;
  top:0;
  background:rgba(255,215,0,0.08);
  backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,215,0,0.2);
  padding:15px 20px;
  z-index:1000;
}

.logo{
  text-align:center;
  color:gold;
  font-size:28px;
  font-weight:bold;
}

.hero{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
}

.glass{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(14px);
  border:1px solid rgba(255,215,0,0.2);
  border-radius:25px;
  padding:30px;
  box-shadow:0 0 30px rgba(255,215,0,0.15);
}

h1{
  font-size:3rem;
  color:gold;
}

p{
  color:#ddd;
  margin-top:10px;
}

.btn{
  margin-top:20px;
  padding:12px 25px;
  border:none;
  border-radius:25px;
  background:gold;
  color:#111;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

.btn:hover{
  transform:scale(1.05);
}

.btn.active{
  background:limegreen;
  color:white;
}

section{
  padding:70px 20px;
}

.section-title{
  text-align:center;
  color:gold;
  font-size:2rem;
  margin-bottom:30px;
}

.members-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
  gap:15px;
  max-width:1200px;
  margin:auto;
}

.card{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(12px);
  border-radius:20px;
  padding:20px;
  text-align:center;
  border:1px solid rgba(255,215,0,0.2);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-8px);
}

.avatar{
  width:100px;
  height:100px;
  border-radius:50%;
  border:3px solid gold;
  object-fit:cover;
  margin-bottom:15px;
}

.badge{
  display:inline-block;
  padding:5px 10px;
  margin-top:8px;
  border-radius:12px;
  font-size:12px;
  background:rgba(255,215,0,0.2);
  color:gold;
}

footer{
  text-align:center;
  padding:30px;
  color:#aaa;
}
</style>
</head>

<body>

<header>
  <div class="logo">MRZ Official</div>
</header>

<section class="hero">
  <div class="glass">
    <h1>Welcome to MRZ Official</h1>
    <p>Official Gaming Team</p>
    <button class="btn" id="joinBtn">Join Team</button>
  </div>
</section>

<section>
  <h2 class="section-title">About MRZ</h2>
  <div class="glass">
    <p>
      MRZ Official is a professional gaming community built for teamwork,
      skill, and entertainment.
    </p>
  </div>
</section>

<section>
  <h2 class="section-title">Our Members</h2>
  <div class="members-grid" id="membersGrid"></div>
</section>

<footer>
  © 2026 MRZ Official
</footer>

<script>

// Join button
const btn = document.getElementById("joinBtn");

btn.addEventListener("click", () => {
  btn.classList.toggle("active");
  btn.innerText = btn.classList.contains("active")
    ? "Joined ✔"
    : "Join Team";
});

// Members
const members = [
{
  name:"Mrz thoppi",
  role:"God Father",
  img:"images/thoppi.jpg"
},
{
  name:"Mrz rambo",
  role:"Leader",
  img:"images/default.jpg"
},
{
  name:"Mrz sheik",
  role:"Co Leader",
  img:"images/default.jpg"
},
{
  name:"Mrz mack",
  role:"Co Leader",
  img:"images/default.jpg"
}
];

// Render members
const grid = document.getElementById("membersGrid");

members.forEach(member => {

  const card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
    <img src="${member.img}" class="avatar">
    <h3>${member.name}</h3>
    <div class="badge">${member.role}</div>
    <p>Instagram | Discord</p>
  `;

  grid.appendChild(card);
});

</script>

</body>
</html>
