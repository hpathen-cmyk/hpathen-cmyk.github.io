<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRZ Official</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f0f0f;
color:white;
}

header{
text-align:center;
padding:20px;
background:#111;
color:gold;
font-size:28px;
font-weight:bold;
}

.members-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
padding:20px;
}

.card{
background:#1a1a1a;
border:1px solid gold;
border-radius:15px;
text-align:center;
padding:15px;
}

.avatar{
width:85px;
height:85px;
border-radius:50%;
border:2px solid gold;
object-fit:cover;
}

.badge{
margin-top:8px;
display:inline-block;
padding:5px 10px;
background:rgba(255,215,0,0.2);
color:gold;
border-radius:10px;
font-size:12px;
}

</style>
</head>

<body>

<header>MRZ OFFICIAL MEMBERS</header>

<div class="members-grid" id="grid"></div>

<script>

const members = [
{
name:"Mrz Thoppi",
role:"God Father",
image:"https://i.ibb.co/cc9R5Hrt/Screenshot-20260524-145928-Instagram.png"
},
{
name:"Mrz Rambo",
role:"Leader",
image:"https://via.placeholder.com/100"
},
{
name:"Mrz Sheik",
role:"Co Leader",
image:"https://via.placeholder.com/100"
},
{
name:"Mrz Mack",
role:"Co Leader",
image:"https://via.placeholder.com/100"
},
{
name:"Mrz Appapan",
role:"Member",
image:"https://via.placeholder.com/100"
},
{
name:"Mrz Bilal",
role:"Member",
image:"https://via.placeholder.com/100"
},
{
name:"Mrz Raju Bhai",
role:"Member",
image:"https://via.placeholder.com/100"
},
{
name:"Mrz Kurup Denny",
role:"Member",
image:"https://via.placeholder.com/100"
}
];

const grid = document.getElementById("grid");

members.forEach(m => {

const card = document.createElement("div");
card.className = "card";

card.innerHTML = `
<img src="${m.image}" class="avatar">
<h4>${m.name}</h4>
<div class="badge">${m.role}</div>
`;

grid.appendChild(card);

});

</script>

</body>
</html>
