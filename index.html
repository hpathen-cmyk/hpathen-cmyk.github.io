<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>

<style>
body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    text-align:center;
}

h1{
    font-size:48px;
    margin-bottom:10px;
}

p{
    color:#ccc;
    margin-bottom:25px;
}

button{
    padding:15px 35px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:white;
    color:black;
}

button:hover{
    background:#ddd;
}
</style>
</head>
<body>

<div class="container">
    <h1>Welcome</h1>
    <p>Click the button below.</p>

    <button id="openBtn">Open</button>
</div>

<audio id="sound">
    <source src="sound.mp3" type="audio/mpeg">
</audio>

<script>
const button = document.getElementById("openBtn");
const sound = document.getElementById("sound");

button.addEventListener("click", () => {
    sound.currentTime = 0;
    sound.play();
});
</script>

</body>
</html>
