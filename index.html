<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRZ Aurora Clan</title>

<style>
body{
  margin:0;
  font-family:Arial;
  color:white;
  overflow-x:hidden;
  background:#05060a;
}

/* AURORA BACKGROUND */
#aurora{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:-1;
}

/* HEADER */
header{
  text-align:center;
  padding:20px;
  font-size:28px;
  font-weight:bold;
  color:#b8fff9;
  text-shadow:0 0 20px #4dfcff;
  background:rgba(0,0,0,0.4);
  backdrop-filter: blur(6px);
}

/* TOP BAR */
.topbar{
  display:flex;
  justify-content:center;
  gap:10px;
  padding:10px;
  flex-wrap:wrap;
}

input, select{
  padding:10px;
  border-radius:10px;
  border:none;
  outline:none;
  background:rgba(255,255,255,0.1);
  color:white;
}

/* GRID */
.members-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:20px;
  padding:20px;
  perspective:1200px;
}

/* CARD */
.card{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(77,252,255,0.4);
  border-radius:15px;
  text-align:center;
  padding:15px;
  transition:0.3s;
  backdrop-filter: blur(10px);
  cursor:pointer;
  box-shadow:0 0 15px rgba(77,252,255,0.1);
}

.card:hover{
  transform:scale(1.05) rotateY(8deg);
  box-shadow:0 0 25px #4dfcff;
}

/* IMAGE */
.avatar{
  width:80px;
  height:80px;
  border-radius:50%;
  border:2px solid #4dfcff;
  object-fit:cover;
  box-shadow:0 0 15px #4dfcff;
}

/* BADGE */
.badge{
  display:inline-block;
  margin-top:8px;
  padding:5px 10px;
  border-radius:10px;
  font-size:12px;
  color:#b8fff9;
  background:rgba(77,252,255,0.15);
  border:1px solid rgba(77,252,255,0.4);
}

/* MODAL */
#modal{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.85);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-box{
  background:rgba(10,15,20,0.9);
  padding:20px;
  border-radius:15px;
  border:1px solid #4dfcff;
  text-align:center;
  box-shadow:0 0 25px #4dfcff;
}

button{
  margin-top:10px;
  padding:6px 12px;
  background:#4dfcff;
  border:none;
  cursor:pointer;
  border-radius:5px;
  font-weight:bold;
}
</style>
</head>

<body>

<canvas id="aurora"></canvas>

<header>❄ MRZ AURORA CLAN ❄</header>

<div class="topbar">
  <input id="search" placeholder="Search member...">
  <select id="filter">
    <option>All</option>
    <option>God Father</option>
    <option>Leader</option>
    <option>Co Leader</option>
    <option>Member</option>
  </select>
</div>

<div class="members-grid" id="grid"></div>

<!-- MODAL -->
<div id="modal">
  <div class="modal-box">
    <h3 id="mname"></h3>
    <div id="mrole" class="badge"></div>
    <br>
    <button onclick="closeModal()">Close</button>
  </div>
</div>

<script>

/* AURORA ANIMATION */
const canvas=document.getElementById("aurora");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let t=0;

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  let gradient=ctx.createLinearGradient(0,0,canvas.width,canvas.height);
  gradient.addColorStop(0,"#00ffe5");
  gradient.addColorStop(0.5,"#7a5cff");
  gradient.addColorStop(1,"#00ff95");

  ctx.fillStyle=gradient;
  ctx.globalAlpha=0.08;

  for(let i=0;i<5;i++){
    ctx.beginPath();
    ctx.ellipse(
      canvas.width/2 + Math.sin(t+i)*200,
      canvas.height/2 + Math.cos(t+i)*100,
      400,200,0,0,Math.PI*2
    );
    ctx.fill();
  }

  t+=0.01;
  requestAnimationFrame(draw);
}
draw();

/* DATA */
const members = [
{name:"Mrz Thoppi",role:"God Father",image:"https://i.postimg.cc/7LPXhncP/Screenshot-20260524-145928-Instagram.png"},
{name:"Mrz Rambo",role:"Leader",image:"https://i.postimg.cc/pTCmTKwX/Screenshot-20260527-185749-Instagram.png"},
{name:"Mrz Sheik",role:"Co Leader",image:"https://i.postimg.cc/pLk8ybKM/Screenshot-20260527-185803-Instagram.png"},
{name:"Mrz Mack",role:"Co Leader",image:"https://i.postimg.cc/mDnykffZ/Screenshot-20260527-191534-Instagram.png"},
{name:"Mrz Appapan",role:"Member",image:"https://i.postimg.cc/kXWMTQ5D/Screenshot-20260527-192458-Instagram.png"},
{name:"Mrz Bilal",role:"Member",image:"https://i.postimg.cc/L8RPD6mZ/Screenshot-20260527-193149-Instagram.png"},
{name:"Mrz Raju Bhai",role:"Member",image:"https://i.postimg.cc/MpyDZFpj/Screenshot-20260527-194203-Instagram.png"},
{name:"Mrz Kurup Denny",role:"Member",image:"https://i.postimg.cc/m2840S0M/Screenshot-20260527-202248-Instagram.png"},
{name:"Mrz Fluffy",role:"Member",image:"https://i.postimg.cc/J7d3hwV3/Screenshot-20260527-204830-Instagram.png"},
{name:"Mrz CK Mari",role:"Member",image:"https://i.postimg.cc/NfdRzWDV/Screenshot-20260527-205651-Instagram.png"}
];

const grid=document.getElementById("grid");
const search=document.getElementById("search");
const filter=document.getElementById("filter");

function show(list){
  grid.innerHTML="";
  list.forEach(m=>{
    let div=document.createElement("div");
    div.className="card";

    div.innerHTML=`
      <img class="avatar" src="${m.image}">
      <h3>${m.name}</h3>
      <div class="badge">${m.role}</div>
    `;

    div.onclick=()=>openModal(m);
    grid.appendChild(div);
  });
}

function update(){
  let s=search.value.toLowerCase();
  let f=filter.value;

  let out=members.filter(m=>{
    return m.name.toLowerCase().includes(s) &&
    (f==="All"||m.role===f);
  });

  show(out);
}

search.oninput=update;
filter.onchange=update;

function openModal(m){
  document.getElementById("modal").style.display="flex";
  document.getElementById("mname").innerText=m.name;
  document.getElementById("mrole").innerText=m.role;
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

show(members);

</script>

</body>
</html>
