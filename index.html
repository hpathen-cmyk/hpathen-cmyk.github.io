<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRZ Galaxy Parallax Pro</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#000;
  color:white;
  overflow-x:hidden;
}

/* 🌌 GALAXY LAYERS */
.layer{
  position:fixed;
  width:200%;
  height:200%;
  background:
    radial-gradient(circle at 20% 20%, #1a2b4f, transparent),
    radial-gradient(circle at 80% 80%, #3a1b4f, transparent),
    radial-gradient(circle at center, #000, #000);
  z-index:-2;
}

.stars{
  position:fixed;
  width:200%;
  height:200%;
  background:radial-gradient(white 1px, transparent 1px);
  background-size:60px 60px;
  opacity:0.12;
  z-index:-1;
}

/* 🚀 LOGO */
.logo{
  text-align:center;
  font-size:40px;
  font-weight:bold;
  margin-top:25px;
  color:#7ffcff;
  letter-spacing:4px;
  animation:float 3s ease-in-out infinite, glow 2s infinite alternate;
}

@keyframes float{
  0%{transform:translateY(0px);}
  50%{transform:translateY(-10px);}
  100%{transform:translateY(0px);}
}

@keyframes glow{
  from{ text-shadow:0 0 10px #7ffcff; }
  to{ text-shadow:0 0 30px #7ffcff, 0 0 50px #3aa7ff; }
}

.sub{
  text-align:center;
  color:#aaa;
  margin-bottom:20px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
  padding:20px;
}

/* CARD */
.card{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(127,255,255,0.15);
  border-radius:15px;
  padding:15px;
  text-align:center;
  backdrop-filter:blur(10px);
  transition:0.4s;
}

.card:hover{
  transform:translateY(-8px) scale(1.03);
  box-shadow:0 0 25px rgba(127,255,255,0.3);
}

.avatar{
  width:80px;
  height:80px;
  border-radius:50%;
  border:2px solid #7ffcff;
}

.badge{
  margin-top:8px;
  display:inline-block;
  padding:5px 10px;
  font-size:12px;
  border-radius:10px;
  background:rgba(127,255,255,0.15);
}
</style>
</head>

<body>

<div class="layer" id="layer"></div>
<div class="stars" id="stars"></div>
