<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRZ Official</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:linear-gradient(135deg,#0f0f0f,#1a1a1a);
  color:white;
  overflow-x:hidden;
}

header{
  position:sticky;
  top:0;
  background:rgba(255,215,0,0.08);
  backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,215,0,0.2);
  padding:15px 20px;
  z-index:1000;
}

nav{
  display:flex;
  justify-content:center;
  align-items:center;
}

.logo{
  color:gold;
  font-size:28px;
  font-weight:bold;
}

.hero{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
}

.glass{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(14px);
  border:1px solid rgba(255,215,0,0.2);
  border-radius:25px;
  padding:30px;
  box-shadow:0 0 30px rgba(255,215,0,0.15);
}

h1{
  font-size:3rem;
  color:gold;
}

p{
  color:#ddd;
  margin-top:10px;
  line-height:1.6;
}

.btn{
  margin-top:20px;
  padding:12px 25px;
  border:none;
  border-radius:25px;
  background:gold;
  color:#111;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

.btn:hover{
  transform:scale(1.05);
}

.btn.active{
  background:limegreen;
  color:white;
}

section{
  padding:70px 20px;
}

.section-title{
  text-align:center;
  color:gold;
  font-size:2rem;
  margin-bottom:30px;
}

.members-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));
  gap:15px;
  max-width:1200px;
  margin:auto;
}

.card{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(12px);
  border-radius:20px;
  padding:20px;
  text-align:center;
  border:1px solid rgba(255,215,0,0.2);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-8px);
}

.avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  border:2px solid gold;
  margin:0 auto 15px;
  background:#333;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:15px;
}

.gallery div{
  height:150px;
  background:#222;
  border-radius:20px;
  border:1px solid rgba(255,215,0,0.2);
}

footer{
  text-align:center;
  padding:30px;
  color:#aaa;
}

html{
  scroll-behavior:smooth;
}
</style>
</head>

<body>

<header>
<nav>
<div class="logo">MRZ Official</div>
</nav>
</header>

<section class="hero">
<div class="glass">
<h1>Welcome to MRZ Official</h1>
<p>Official Gaming Team</p>
<button class="btn">Join Team</button>
</div>
</section>

<section id="about">
<h2 class="section-title">About MRZ</h2>
<div class="glass">
<p>
MRZ Official is a professional gaming community built for teamwork, skill, and entertainment.
We bring passionate gamers together to compete as one powerful team.
</p>
</div>
</section>

<section id="members">
<h2 class="section-title">Our Members</h2>
<div class="members-grid" id="membersGrid"></div>
</section>

<section>
<h2 class="section-title">Gallery</h2>
<div class="gallery">
<div></div><div></div><div></div><div></div>
</div>
</section>

<footer>
© 2026 MRZ Official
</footer>

<script>
// Button toggle
const btn = document.querySelector(".btn");

btn.addEventListener("click", () => {
  btn.classList.toggle("active");
  btn.innerText = btn.classList.contains("active")
    ? "Joined ✔"
    : "Join Team";
});

// 35 members auto generator
const grid = document.getElementById("membersGrid");

for(let i = 1; i <= 35; i++){
  const card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
    <div class="avatar"></div>
    <h3>Member ${i}</h3>
    <p>Instagram | Discord</p>
  `;

  grid.appendChild(card);
}
</script>

</body>
</html>
