<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#111;
    color:#fff;
}

.container{
    text-align:center;
}

h1{
    font-size:48px;
    margin-bottom:10px;
}

p{
    color:#ccc;
    margin-bottom:25px;
}

button{
    padding:15px 40px;
    font-size:20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#00bfff;
    color:white;
}

button:hover{
    background:#0099cc;
}
</style>
</head>
<body>

<div class="container">
    <h1>Welcome</h1>
    <p>Tap the button below</p>

    <button id="openBtn">Open</button>
</div>

<audio id="sound" preload="auto">
    <source src="sound.mp3" type="audio/mpeg">
    Your browser does not support audio.
</audio>

<script>
const button = document.getElementById("openBtn");
const sound = document.getElementById("sound");

button.addEventListener("click", function () {
    sound.pause();
    sound.currentTime = 0;

    sound.play()
        .then(() => {
            console.log("Audio playing");
        })
        .catch((err) => {
            alert("Audio failed: " + err.message);
            console.error(err);
        });
});
</script>

</body>
</html>
