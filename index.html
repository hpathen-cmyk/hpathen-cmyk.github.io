<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRZ Official</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#111;
  color:white;
}

header{
  background:#1a1a1a;
  padding:15px;
  text-align:center;
  border-bottom:2px solid gold;
}

.logo{
  color:gold;
  font-size:28px;
  font-weight:bold;
}

.hero{
  text-align:center;
  padding:60px 20px;
}

.hero h1{
  color:gold;
}

.btn{
  margin-top:20px;
  padding:12px 25px;
  border:none;
  border-radius:30px;
  background:gold;
  font-weight:bold;
  cursor:pointer;
}

.btn.active{
  background:limegreen;
  color:white;
}

.section-title{
  text-align:center;
  color:gold;
  margin:30px 0;
}

.members-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  padding:20px;
}

.card{
  background:#1f1f1f;
  border:1px solid gold;
  border-radius:20px;
  padding:20px;
  text-align:center;
}

.avatar{
  width:100px;
  height:100px;
  border-radius:50%;
  border:3px solid gold;
  object-fit:cover;
  margin-bottom:10px;
  background:#333;
}

.badge{
  display:inline-block;
  background:gold;
  color:black;
  padding:5px 12px;
  border-radius:10px;
  margin-top:10px;
}

footer{
  text-align:center;
  padding:20px;
  color:#aaa;
}
</style>
</head>

<body>

<header>
<div class="logo">MRZ Official</div>
</header>

<section class="hero">
<h1>Welcome to MRZ Official</h1>
<p>Official Gaming Team</p>
<button class="btn" id="joinBtn">Join Team</button>
</section>

<h2 class="section-title">Our Members</h2>

<div class="members-grid" id="membersGrid"></div>

<footer>
© 2026 MRZ Official
</footer>

<script>

// Join button
const btn = document.getElementById("joinBtn");

btn.addEventListener("click", () => {
  btn.classList.toggle("active");

  btn.innerText = btn.classList.contains("active")
  ? "Joined ✔"
  : "Join Team";
});

// Members
const members = [
"Mrz thoppi (God father)",
"Mrz rambo (Leader)",
"Mrz sheik (Co Leader)",
"Mrz mack (Co Leader)",
"Mrz appapan (Member)",
"Mrz bilal (Member)",
"Mrz Raju bhai (Member)",
"Mrz kurup denny (Member)",
"Mrz fluffy (Member)",
"Mrz ck mari (Member)",
"Mrz malik (Member)"
];

const grid = document.getElementById("membersGrid");

members.forEach(name => {

let role = "Member";

if(name.includes("God father")){
  role = "God Father";
}
else if(name.includes("Co Leader")){
  role = "Co Leader";
}
else if(name.includes("Leader")){
  role = "Leader";
}

const card = document.createElement("div");
card.className = "card";

card.innerHTML = `
  ${
    name.includes("thoppi")
    ? '<img src="thoppi.jpg" class="avatar">'
    : '<div class="avatar"></div>'
  }

  <h3>${name}</h3>
  <div class="badge">${role}</div>
`;

grid.appendChild(card);

});

</script>

</body>
</html>
