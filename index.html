background:#111;
color:gold;
font-size:28px;
font-weight:bold;
}

.members-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
gap:15px;
padding:20px;
}

.card{
background:#1a1a1a;
border:1px solid gold;
border-radius:15px;
text-align:center;
padding:15px;
transition:0.3s;
}

.card:hover{
transform:scale(1.05);
}

.avatar{
width:80px;
height:80px;
border-radius:50%;
border:2px solid gold;
object-fit:cover;
}

.badge{
margin-top:8px;
display:inline-block;
padding:5px 10px;
background:rgba(255,215,0,0.2);
