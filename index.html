<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRZ Scroll Pro</title>

<style>
body{
  margin:0;
  font-family:Arial;
  color:white;
  transition:0.5s ease;
  background:#05060a;
}

/* HEADER */
header{
  text-align:center;
  padding:20px;
  font-size:26px;
  font-weight:bold;
  position:sticky;
  top:0;
  background:rgba(0,0,0,0.4);
  backdrop-filter: blur(8px);
  z-index:10;
  color:#7ffcff;
}

/* GRID */
.members-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
  padding:20px;
}

/* CARD */
.card{
  background:rgba(255,255,255,0.06);
  border-radius:15px;
  text-align:center;
  padding:15px;
  border:1px solid rgba(255,255,255,0.1);
  backdrop-filter: blur(8px);
  transition:0.3s;
  cursor:pointer;
}

.card:hover{
  transform:scale(1.05);
  border:1px solid #7ffcff;
  box-shadow:0 0 15px #7ffcff;
}

/* IMAGE */
.avatar{
  width:80px;
  height:80px;
  border-radius:50%;
  border:2px solid #7ffcff;
}

/* BADGE */
.badge{
  display:inline-block;
  margin-top:8px;
  padding:5px 10px;
  font-size:12px;
  border-radius:10px;
  background:rgba(127,255,255,0.15);
}

/* MODAL */
#modal{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.85);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-box{
  background:#0c1118;
  padding:20px;
  border-radius:15px;
  border:1px solid #7ffcff;
  text-align:center;
}
button{
  margin-top:10px;
  padding:8px 12px;
  background:#7ffcff;
  border:none;
  cursor:pointer;
  font-weight:bold;
  border-radius:5px;
}
</style>
</head>

<body>

<header>🌌 MRZ SCROLL PRO MEMBERS 🌌</header>

<div class="members-grid" id="grid"></div>

<!-- MODAL -->
<div id="modal">
  <div class="modal-box">
    <h3 id="mname"></h3>
    <div id="mrole" class="badge"></div>
    <br>
    <button onclick="closeModal()">Close</button>
  </div>
</div>

<script>

/* ===== SCROLL THEME SYSTEM ===== */
window.addEventListener("scroll", () => {
  let y = window.scrollY;

  if (y < 400) {
    document.body.style.background = "#05060a"; // Aurora dark
  } 
  else if (y < 900) {
    document.body.style.background = "#001b3d"; // Blue
  } 
  else if (y < 1400) {
    document.body.style.background = "#120018"; // Purple
  } 
  else {
    document.body.style.background = "#000000"; // Deep black neon
  }
});

/* ===== ALL MEMBERS ===== */
const members = [
{name:"Mrz Thoppi",role:"God Father",image:"https://i.postimg.cc/7LPXhncP/Screenshot-20260524-145928-Instagram.png"},
{name:"Mrz Rambo",role:"Leader",image:"https://i.postimg.cc/pTCmTKwX/Screenshot-20260527-185749-Instagram.png"},
{name:"Mrz Sheik",role:"Co Leader",image:"https://i.postimg.cc/pLk8ybKM/Screenshot-20260527-185803-Instagram.png"},
{name:"Mrz Mack",role:"Co Leader",image:"https://i.postimg.cc/mDnykffZ/Screenshot-20260527-191534-Instagram.png"},
{name:"Mrz Appapan",role:"Member",image:"https://i.postimg.cc/kXWMTQ5D/Screenshot-20260527-192458-Instagram.png"},
{name:"Mrz Bilal",role:"Member",image:"https://i.postimg.cc/L8RPD6mZ/Screenshot-20260527-193149-Instagram.png"},
{name:"Mrz Raju Bhai",role:"Member",image:"https://i.postimg.cc/MpyDZFpj/Screenshot-20260527-194203-Instagram.png"},
{name:"Mrz Kurup Denny",role:"Member",image:"https://i.postimg.cc/m2840S0M/Screenshot-20260527-202248-Instagram.png"},
{name:"Mrz Fluffy",role:"Member",image:"https://i.postimg.cc/J7d3hwV3/Screenshot-20260527-204830-Instagram.png"},
{name:"Mrz CK Mari",role:"Member",image:"https://i.postimg.cc/NfdRzWDV/Screenshot-20260527-205651-Instagram.png"},
{name:"Mrz Malik",role:"Member",image:"https://i.postimg.cc/jqpjdv57/Screenshot-20260527-210418-Instagram.png"},
{name:"Mrz Falcon",role:"Member",image:"https://i.postimg.cc/j5rW2bRC/Screenshot-20260527-212914-Instagram.png"},
{name:"Mrz DNL",role:"Member",image:"https://i.postimg.cc/FHrX9ntm/Screenshot-20260527-213517-Instagram.png"},
{name:"Mrz Amban Pro",role:"Member",image:"https://i.postimg.cc/jjv5xJ3x/Screenshot-20260527-214523-Instagram.png"},
{name:"Mrz Charan",role:"Member",image:"https://via.placeholder.com/100"},
{name:"Mrz Joshua",role:"Member",image:"https://via.placeholder.com/100"},
{name:"Mrz Takai",role:"Member",image:"https://via.placeholder.com/100"},
{name:"Mrz Speedo",role:"Member",image:"https://via.placeholder.com/100"},
{name:"Mrz Pranav",role:"Member",image:"https://via.placeholder.com/100"},
{name:"Mrz Bruce",role:"Member",image:"https://via.placeholder.com/100"}
];

const grid=document.getElementById("grid");

/* ===== SHOW MEMBERS ===== */
function show(){
  grid.innerHTML="";
  members.forEach(m=>{
    let div=document.createElement("div");
    div.className="card";

    div.innerHTML=`
      <img class="avatar" src="${m.image}">
      <h3>${m.name}</h3>
      <div class="badge">${m.role}</div>
    `;

    div.onclick=()=>openModal(m);
    grid.appendChild(div);
  });
}
show();

/* ===== MODAL ===== */
function openModal(m){
  document.getElementById("modal").style.display="flex";
  document.getElementById("mname").innerText=m.name;
  document.getElementById("mrole").innerText=m.role;
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

</script>

</body>
</html>
