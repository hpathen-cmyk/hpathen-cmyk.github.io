<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRZ Official 3D</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background: radial-gradient(circle,#111,#000);
  color:white;
  overflow-x:hidden;
}

/* HEADER */
header{
  text-align:center;
  padding:20px;
  background:#111;
  color:gold;
  font-size:28px;
  font-weight:bold;
  letter-spacing:2px;
}

/* SEARCH */
.search-box{
  text-align:center;
  padding:10px;
}
.search-box input{
  width:80%;
  max-width:300px;
  padding:10px;
  border-radius:10px;
  border:none;
  outline:none;
}

/* GRID WITH 3D EFFECT */
.members-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:20px;
  padding:20px;
  perspective:1000px;
}

/* 3D CARD */
.card{
  background: linear-gradient(145deg,#1a1a1a,#0d0d0d);
  border:1px solid gold;
  border-radius:15px;
  text-align:center;
  padding:15px;
  transition:0.4s ease;
  transform-style:preserve-3d;
  box-shadow:0 10px 20px rgba(0,0,0,0.6);
  cursor:pointer;
  position:relative;
}

/* 3D HOVER EFFECT */
.card:hover{
  transform: rotateY(12deg) rotateX(10deg) scale(1.05);
  box-shadow:0 0 25px gold;
}

/* IMAGE FLOAT EFFECT */
.avatar{
  width:80px;
  height:80px;
  border-radius:50%;
  border:2px solid gold;
  object-fit:cover;
  transform:translateZ(30px);
}

/* TEXT POP OUT */
.card h3{
  transform:translateZ(25px);
  margin:10px 0 5px;
}

.badge{
  display:inline-block;
  padding:5px 10px;
  background:rgba(255,215,0,0.2);
  color:gold;
  border-radius:10px;
  font-size:12px;
  transform:translateZ(20px);
}

/* MODAL */
#modal{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.85);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-box{
  background:#1a1a1a;
  padding:20px;
  border-radius:15px;
  text-align:center;
  border:1px solid gold;
  width:260px;
  transform:scale(0.9);
  animation:pop 0.3s forwards;
}

@keyframes pop{
  to{transform:scale(1);}
}
