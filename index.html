<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRZ Active 3D Pro</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#05060a;
  color:white;
  overflow:hidden;
}

.bg{
  position:fixed;
  width:100%;
  height:100%;
  background:radial-gradient(circle at center,#1a2b4f,#05060a);
  z-index:-1;
}

header{
  text-align:center;
  padding:12px;
  font-size:20px;
  color:#7ffcff;
  background:rgba(0,0,0,0.4);
  backdrop-filter:blur(10px);
}

/* SCENE */
.scene{
  height:75vh;
  display:flex;
  justify-content:center;
  align-items:center;
  perspective:1200px;
}

.carousel{
  width:250px;
  height:350px;
  position:relative;
  transform-style:preserve-3d;
}

/* CARD */
.card{
  position:absolute;
  width:180px;
  height:240px;
  left:35px;
  top:55px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(127,255,255,0.25);
  border-radius:15px;
  text-align:center;
  padding:10px;
  backdrop-filter:blur(10px);
  transition:0.4s;
  opacity:0.5;
  transform:scale(0.85);
}

.card.active{
  opacity:1;
  transform:scale(1.15);
  box-shadow:0 0 25px #7ffcff;
}

.avatar{
  width:75px;
  height:75px;
  border-radius:50%;
  border:2px solid #7ffcff;
}

.badge{
  margin-top:6px;
  font-size:12px;
  padding:4px 8px;
  border-radius:10px;
  display:inline-block;
  background:rgba(127,255,255,0.15);
}

/* BOTTOM BAR */
.bar{
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  overflow-x:auto;
  gap:10px;
  padding:10px;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(10px);
}

.bar-item{
  width:60px;
  height:60px;
  border-radius:50%;
  overflow:hidden;
  border:2px solid transparent;
  cursor:pointer;
  transition:0.3s;
  flex:0 0 auto;
}

.bar-item img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.bar-item.active{
  border:2px solid #7ffcff;
  transform:scale(1.2);
}
</style>
</head>

<body>

<div class="bg"></div>
<header>⭐ MRZ ACTIVE 3D PRO ⭐</header>

<div class="scene">
  <div class="carousel" id="carousel"></div>
</div>

<div class="bar" id="bar"></div>

<script>

const members=[
{name:"Mrz Thoppi",role:"God Father",image:"https://i.postimg.cc/7LPXhncP/Screenshot-20260524-145928-Instagram.png"},
{name:"Mrz Rambo",role:"Leader",image:"https://i.postimg.cc/pTCmTKwX/Screenshot-20260527-185749-Instagram.png"},
{name:"Mrz Sheik",role:"Co Leader",image:"https://i.postimg.cc/pLk8ybKM/Screenshot-20260527-185803-Instagram.png"},
{name:"Mrz Mack",role:"Co Leader",image:"https://i.postimg.cc/mDnykffZ/Screenshot-20260527-191534-Instagram.png"},
{name:"Mrz Appapan",role:"Member",image:"https://i.postimg.cc/kXWMTQ5D/Screenshot-20260527-192458-Instagram.png"},
{name:"Mrz Bilal",role:"Member",image:"https://i.postimg.cc/L8RPD6mZ/Screenshot-20260527-193149-Instagram.png"},
{name:"Mrz Raju Bhai",role:"Member",image:"https://i.postimg.cc/MpyDZFpj/Screenshot-20260527-194203-Instagram.png"},
{name:"Mrz Falcon",role:"Member",image:"https://i.postimg.cc/j5rW2bRC/Screenshot-20260527-212914-Instagram.png"}
];

const carousel=document.getElementById("carousel");
const bar=document.getElementById("bar");

let angle=0;
let activeIndex=0;
const step=360/members.length;

/* CREATE 3D CARDS */
const cards=[];

members.forEach((m,i)=>{

  let div=document.createElement("div");
  div.className="card";
  div.style.transform=`rotateY(${i*step}deg) translateZ(300px)`;

  div.innerHTML=`
    <img class="avatar" src="${m.image}">
    <h3>${m.name}</h3>
    <div class="badge">${m.role}</div>
  `;

  carousel.appendChild(div);
  cards.push(div);

  let b=document.createElement("div");
  b.className="bar-item";

  b.innerHTML=`<img src="${m.image}">`;

  b.onclick=()=>{
    activeIndex=i;
    angle = -i * step;
    updateActive();
  };

  bar.appendChild(b);
});

/* ACTIVE UPDATE */
function updateActive(){
  cards.forEach((c,i)=>{
    c.classList.toggle("active", i===activeIndex);
  });

  document.querySelectorAll(".bar-item").forEach((b,i)=>{
    b.classList.toggle("active", i===activeIndex);
  });
}

/* AUTO ROTATION */
function animate(){
  angle += 0.2;
  carousel.style.transform=`rotateY(${angle}deg)`;

  activeIndex = Math.round((-angle / step)) % members.length;
  if(activeIndex < 0) activeIndex += members.length;

  updateActive();

  requestAnimationFrame(animate);
}
animate();

/* SCROLL CONTROL */
window.addEventListener("wheel",(e)=>{
  angle += e.deltaY * 0.2;
});

</script>

</body>
  </html>
